<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>સરપંચ પોર્ટલ - ગ્રામ પંચાયત</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col">

    <div id="splash-screen" class="fixed inset-0 bg-emerald-900 flex flex-col items-center justify-center z-50 transition-opacity duration-700">
        <div id="splash-logo-container" class="w-20 h-20 mb-4 flex items-center justify-center bg-white rounded-full shadow-lg overflow-hidden p-1">
            <i class="fa-solid fa-landmark text-3xl text-emerald-800"></i>
        </div>
        <h1 class="text-white text-xl font-bold">ગ્રામ પંચાયત સરપંચ પોર્ટલ</h1>
        <p class="text-emerald-200 text-xs mt-1">લોડ થઈ રહ્યું છે...</p>
    </div>

    <div id="sarpanch-login-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-40 p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-xl font-bold text-gray-800 mb-1">સરપંચ લૉગિન</h2>
            <form id="sarpanch-login-form" class="space-y-3 text-left">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">LGD કોડ / પંચાયત ID</label>
                    <input type="text" id="login-lgd" placeholder="દા.ત. 500000" required class="w-full border p-2.5 rounded text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">પાસવર્ડ</label>
                    <input type="password" id="login-password" placeholder="પાસવર્ડ દાખલ કરો" required class="w-full border p-2.5 rounded text-sm">
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded hover:bg-emerald-700 transition mt-2 text-sm shadow">લૉગિન કરો</button>
            </form>
        </div>
    </div>

    <div id="sarpanch-dashboard" class="hidden flex-1 flex flex-col">
        <header class="bg-emerald-900 text-white shadow-md py-3 px-4 flex justify-between items-center sticky top-0 z-30">
            <h1 class="text-sm font-bold" id="sarpanch-header-title">ગ્રામ પંચાયત - સરપંચ હેન્ડલ</h1>
            <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg">લોગઆઉટ</button>
        </header>

        <main class="flex-1 p-4 max-w-4xl mx-auto w-full space-y-6">
            
            <!-- ૨. નવી પોસ્ટ / નોટિસ મૂકો (કલેક્શન: notices) -->
            <div class="bg-blue-50/80 border border-blue-200 p-5 rounded-xl shadow-sm space-y-4">
                <h3 class="font-bold border-b border-blue-300 pb-2 text-blue-950 text-sm">૨. નવી પોસ્ટ / નોટિસ મૂકો</h3>
                <form id="sarpanch-add-notice-form" class="bg-white p-4 rounded-xl border border-blue-100 shadow-sm space-y-3">
                    <input type="hidden" id="edit-notice-id" value="">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">નોટિસનું શીર્ષક (Title)</label>
                        <input type="text" id="notice-title" placeholder="દા.ત. ગ્રામસભા અંગે અગત્યની સૂચના" required class="w-full border p-2 rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">વિગત (Description)</label>
                        <textarea id="notice-desc" rows="3" placeholder="માહિતી અહીં લખો..." required class="w-full border p-2 rounded text-xs"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="notice-submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded text-xs">નોટિસ પોસ્ટ કરો</button>
                        <button type="button" id="notice-cancel-btn" class="hidden bg-gray-500 text-white font-bold px-4 py-2 rounded text-xs">રદ કરો</button>
                    </div>
                </form>
            </div>

            <!-- ૧. તાજી પોસ્ટ્સ અને ન્યૂઝ મેનેજ કરો 📢 (કલેક્શન: posts) -->
            <div class="bg-blue-50/80 border border-blue-200 p-5 rounded-xl shadow-sm space-y-4">
                <h3 class="font-bold border-b border-blue-300 pb-2 text-blue-950 text-sm">૧. તાજી પોસ્ટ્સ અને ન્યૂઝ મેનેજ કરો 📢</h3>
                <form id="sarpanch-add-post-form" class="bg-white p-4 rounded-xl border border-blue-100 shadow-sm space-y-3">
                    <input type="hidden" id="edit-post-id" value="">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">પોસ્ટ / ન્યૂઝનું શીર્ષક (Title)</label>
                        <input type="text" id="post-title" placeholder="દા.ત. નવું આરોગ્ય કેન્દ્ર મંજૂર" required class="w-full border p-2 rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">વિગત (Description)</label>
                        <textarea id="post-desc" rows="3" placeholder="વિગત લખો..." required class="w-full border p-2 rounded text-xs"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" id="post-submit-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded text-xs">પોસ્ટ ઉમેરો</button>
                        <button type="button" id="post-cancel-btn" class="hidden bg-gray-500 text-white font-bold px-4 py-2 rounded text-xs">રદ કરો</button>
                    </div>
                </form>
                <div class="space-y-2 mt-3">
                    <span class="text-xs font-bold text-gray-700">હાલની તમામ પોસ્ટ્સ અને ન્યૂઝ:</span>
                    <div id="sarpanch-posts-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </div>

            <!-- ૫. આવેલ ફરિયાદો અને સ્ટેટસ મેનેજર -->
            <div class="bg-emerald-50/80 border border-emerald-200 p-5 rounded-xl shadow-sm space-y-4">
                <h3 class="font-bold border-b border-emerald-300 pb-2 text-emerald-950 text-sm">૫. આવેલ ફરિયાદો અને સ્ટેટસ મેનેજર</h3>
                
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <select id="admin-complaint-filter" class="border border-emerald-300 p-2 rounded text-xs bg-white font-medium">
                        <option value="ALL">તમામ ફરિયાદો</option>
                        <option value="PENDING">ફક્ત પેન્ડિંગ</option>
                        <option value="RESOLVED">નિવારણ થયેલ (Resolved)</option>
                    </select>
                    <div class="flex items-center gap-2">
                        <input type="month" id="report-month-select" class="border border-emerald-300 p-1.5 rounded text-xs bg-white">
                        <button type="button" id="download-pdf-btn" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-3 py-1.5 rounded shadow flex items-center gap-1">
                            <i class="fa-solid fa-file-pdf"></i> PDF ડાઉનલોડ
                        </button>
                    </div>
                </div>

                <div id="admin-complaint-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-1">
                    <p class="text-xs text-gray-500">ફરિયાદો લોડ થઈ રહી છે...</p>
                </div>
            </div>

        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
            authDomain: "gram-panchayat-33c86.firebaseapp.com",
            projectId: "gram-panchayat-33c86",
            storageBucket: "gram-panchayat-33c86.firebasestorage.app",
            messagingSenderId: "1025176315779",
            appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
            measurementId: "G-TQBSXCWNBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let lgdCode = sessionStorage.getItem("sarpanch_lgd_code") || "";

        function getCol(sub) { return collection(db, "panchayats", lgdCode, sub); }
        function getDocRef(sub, id) { return doc(db, "panchayats", lgdCode, sub, id); }

        setTimeout(() => {
            const splash = document.getElementById("splash-screen");
            if (splash) { splash.classList.add("opacity-0"); setTimeout(() => splash.remove(), 700); }
            checkAuth();
        }, 1500);

        function checkAuth() {
            if (lgdCode) {
                document.getElementById("sarpanch-login-modal").classList.add("hidden");
                document.getElementById("sarpanch-dashboard").classList.remove("hidden");
                loadData();
            } else {
                document.getElementById("sarpanch-login-modal").classList.remove("hidden");
            }
        }

        document.getElementById("sarpanch-login-form")?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const inputCode = document.getElementById("login-lgd").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const snap = await getDoc(doc(db, "panchayats", inputCode));
            if (snap.exists() && (snap.data().adminPassword || "admin123") === password) {
                lgdCode = inputCode;
                sessionStorage.setItem("sarpanch_lgd_code", lgdCode);
                checkAuth();
            } else {
                alert("❌ ખોટો LGD કોડ અથવા પાસવર્ડ!");
            }
        });

        document.getElementById("logout-btn")?.addEventListener("click", () => {
            sessionStorage.removeItem("sarpanch_lgd_code");
            location.reload();
        });

        function loadData() {
            loadPosts();
            loadComplaints();
        }

        // ૧. પોસ્ટ્સ મેનેજમેન્ટ (posts collection)
        let postsCache = {};
        async function loadPosts() {
            const container = document.getElementById("sarpanch-posts-list");
            const snap = await getDocs(getCol("posts"));
            container.innerHTML = "";
            postsCache = {};
            if (snap.empty) { container.innerHTML = `<p class="text-xs text-gray-500">કોઈ પોસ્ટ નથી.</p>`; return; }
            snap.forEach(d => {
                const item = d.data();
                postsCache[d.id] = item;
                container.innerHTML += `
                    <div class="bg-white p-2.5 border rounded flex justify-between items-center text-xs">
                        <div><b>${item.title}</b><p class="text-gray-500 text-[11px]">${item.desc || ''}</p></div>
                        <div class="flex gap-1">
                            <button onclick="editPost('${d.id}')" class="bg-blue-600 text-white px-2 py-1 rounded">એડિટ</button>
                            <button onclick="deletePost('${d.id}')" class="bg-red-500 text-white px-2 py-1 rounded">ડિલીટ</button>
                        </div>
                    </div>`;
            });
        }

        document.getElementById("sarpanch-add-post-form")?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const editId = document.getElementById("edit-post-id").value;
            const title = document.getElementById("post-title").value.trim();
            const desc = document.getElementById("post-desc").value.trim();
            if (editId) {
                await updateDoc(getDocRef("posts", editId), { title, desc, updatedAt: new Date() });
            } else {
                await addDoc(getCol("posts"), { title, desc, createdAt: new Date() });
            }
            document.getElementById("sarpanch-add-post-form").reset();
            document.getElementById("edit-post-id").value = "";
            document.getElementById("post-submit-btn").innerText = "પોસ્ટ ઉમેરો";
            document.getElementById("post-cancel-btn").classList.add("hidden");
            loadPosts();
        });

        window.editPost = (id) => {
            const data = postsCache[id];
            if (!data) return;
            document.getElementById("edit-post-id").value = id;
            document.getElementById("post-title").value = data.title || "";
            document.getElementById("post-desc").value = data.desc || "";
            document.getElementById("post-submit-btn").innerText = "અપડેટ કરો";
            document.getElementById("post-cancel-btn").classList.remove("hidden");
        };

        window.deletePost = async (id) => {
            if (confirm("પોસ્ટ ડિલીટ કરવી છે?")) {
                await deleteDoc(getDocRef("posts", id));
                loadPosts();
            }
        };

        // ૨. નોટિસ મેનેજમેન્ટ (notices collection)
        document.getElementById("sarpanch-add-notice-form")?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("notice-title").value.trim();
            const desc = document.getElementById("notice-desc").value.trim();
            await addDoc(getCol("notices"), { title, desc, createdAt: new Date() });
            alert("✅ નોટિસ સફળતાપૂર્વક પબ્લિશ થઈ ગઈ!");
            e.target.reset();
        });

        // ૫. ફરિયાદો અને સ્ટેટસ મેનેજર (તારીખ સાથે)
        async function loadComplaints() {
            const container = document.getElementById("admin-complaint-list");
            const filter = document.getElementById("admin-complaint-filter")?.value || "ALL";
            const snap = await getDocs(getCol("complaints"));
            container.innerHTML = "";
            if (snap.empty) { container.innerHTML = `<p class="text-xs text-gray-500">કોઈ ફરિયાદ નથી.</p>`; return; }
            
            snap.forEach(d => {
                const item = d.data();
                const status = item.status || "ફરિયાદ પેન્ડિંગ રાખવામા આવેલ છે";
                
                let dateStr = "તારીખ ઉપલબ્ધ નથી";
                if (item.createdAt && item.createdAt.toDate) {
                    dateStr = item.createdAt.toDate().toLocaleString('gu-IN', { dateStyle: 'short', timeStyle: 'short' });
                }

                if (filter === "PENDING" && !status.includes("પેન્ડિંગ") && !status.includes("કામ ચાલી")) return;
                if (filter === "RESOLVED" && !status.includes("નિવારણ") && !status.includes("Resolved")) return;

                container.innerHTML += `
                    <div class="bg-white p-3 border rounded-xl text-xs space-y-1.5 shadow-sm">
                        <div class="flex justify-between font-bold border-b pb-1">
                            <span>ટોકન: <span class="text-emerald-700">${item.token || 'N/A'}</span> | નામ: ${item.name || 'અનામી'} (મો: ${item.mobile || '-'})</span>
                            <span class="bg-blue-50 text-blue-800 px-2 py-0.5 rounded">${item.type || 'સામાન્ય'}</span>
                        </div>
                        <p><b>તારીખ:</b> <span class="text-amber-700 font-semibold">${dateStr}</span> | <b>વિસ્તાર:</b> ${item.area || '-'}</p>
                        <p class="text-gray-700"><b>વિગત:</b> ${item.details || ''}</p>
                        <div class="flex items-center gap-2 pt-1 border-t">
                            <label class="font-bold text-gray-700">સ્ટેટસ:</label>
                            <select onchange="updateStatus('${d.id}', this.value)" class="border p-1 rounded bg-amber-50 text-[11px] font-bold flex-1">
                                <option value="${status}" selected>હાલનું: ${status}</option>
                                <option value="ફરિયાદ પર કામ ચાલી રહ્યું છે">ફરિયાદ પર કામ ચાલી રહ્યું છે</option>
                                <option value="ફરિયાદ નિવારણ થઈ ગયું છે">ફરિયાદ નિવારણ થઈ ગયું છે</option>
                                <option value="ફરિયાદ પેન્ડિંગ રાખવામા આવેલ છે">ફરિયાદ પેન્ડિંગ રાખવામા આવેલ છે</option>
                            </select>
                        </div>
                    </div>`;
            });
        }

        window.updateStatus = async (id, status) => {
            await updateDoc(getDocRef("complaints", id), { status, updatedAt: new Date() });
            loadComplaints();
        };

        document.getElementById("admin-complaint-filter")?.addEventListener("change", loadComplaints);

        // મહિનો સિલેક્ટ કરીને માત્ર તે જ મહિનાની PDF ડાઉનલોડ
        document.getElementById("download-pdf-btn")?.addEventListener("click", async () => {
            const monthVal = document.getElementById("report-month-select")?.value;
            if (!monthVal) { alert("⚠️ કૃપા કરીને પહેલા મહિનો સિલેક્ટ કરો!"); return; }

            const snap = await getDocs(getCol("complaints"));
            let list = [];
            snap.forEach(d => {
                const item = d.data();
                if (item.createdAt && item.createdAt.toDate) {
                    if (item.createdAt.toDate().toISOString().slice(0, 7) === monthVal) {
                        let dt = item.createdAt.toDate().toLocaleDateString('gu-IN');
                        list.push([item.token || '-', item.name || '-', item.mobile || '-', item.type || '-', dt, item.status || '-']);
                    }
                }
            });

            if (list.length === 0) { alert("આ મહિનામાં કોઈ ફરિયાદ નથી."); return; }

            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF();
            docPdf.text(`Complaint Report - ${monthVal}`, 14, 15);
            docPdf.autoTable({ startY: 20, head: [['Token', 'Name', 'Mobile', 'Type', 'Date', 'Status']], body: list, styles: { fontSize: 8 } });
            docPdf.save(`Complaints_${monthVal}.pdf`);
        });

        checkAuth();
    </script>
</body>
</html>
