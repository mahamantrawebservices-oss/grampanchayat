    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
       import { getFirestore, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
            authDomain: "gram-panchayat-33c86.firebaseapp.com",
            projectId: "gram-panchayat-33c86",
            storageBucket: "gram-panchayat-33c86.firebasestorage.app",
            messagingSenderId: "1025176315779",
            appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
            measurementId: "G-TQBSXCWNBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

       const urlParams = new URLSearchParams(window.location.search);
        const panchayatId = urlParams.get('id') || "ahmedabad_daskroi_motapipalva";
        // ચોક્કસપણે pageId જ ફેચ કરે તેની ખાતરી કરો
        const customPageId = urlParams.get('pageId'); 

        // મુખ્ય પૃષ્ઠ લિંક સાથે panchayat id જાળવી રાખવો
        document.getElementById("back-home-btn").href = `index.html?id=${panchayatId}`;

        async function loadCustomPageContent() {
            const contentDiv = document.getElementById("page-content");
            const headerTitle = document.getElementById("header-title");
            const pageTitle = document.getElementById("page-title");

            if (!customPageId) {
                contentDiv.innerHTML = "<p class='text-red-500 text-center'>⚠️ અમાન્ય પેજ લિંક (pageId મળ્યો નથી).</p>";
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, "panchayats", panchayatId, "custom_pages", customPageId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    headerTitle.innerHTML = `<i class="fa-solid fa-file-lines"></i> ${data.buttonTitle || 'સેવા'}`;
                    pageTitle.innerText = data.buttonTitle || 'પંચાયત સેવા';
                    
                    contentDiv.innerHTML = data.htmlContent || "<p class='text-gray-500 text-center'>કોઈ કન્ટેન્ટ ઉપલબ્ધ નથી.</p>";
                } else {
                    contentDiv.innerHTML = "<p class='text-red-500 text-center'>⚠️ આ પંચાયત સેવા કે પેજ ડેટાબેઝમાં મળ્યું નથી.</p>";
                }
            } catch (err) {
                console.error("પેજ કન્ટેન્ટ લોડ કરવામાં ભૂલ:", err);
                contentDiv.innerHTML = "<p class='text-red-500 text-center'>કન્ટેન્ટ લોડ કરવામાં સમસ્યા આવી.</p>";
            }
        }

        async function loadCustomPageContent() {
            const contentDiv = document.getElementById("page-content");
            const headerTitle = document.getElementById("header-title");
            const pageTitle = document.getElementById("page-title");

            const customPageId = urlParams.get('pageId');
            if (!customPageId) {
                contentDiv.innerHTML = "<p class='text-red-500 text-center'>અમાન્ય પેજ લિંક.</p>";
                return;
            }

            try {
                const docSnap = await getDoc(doc(db, "panchayats", panchayatId, "custom_pages", customPageId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    headerTitle.innerHTML = `<i class="fa-solid fa-file-lines"></i> ${data.buttonTitle || 'સેવા'}`;
                    pageTitle.innerText = data.buttonTitle || 'પંચાયત સેવા';
                    
                    contentDiv.innerHTML = data.htmlContent || "<p class='text-gray-500 text-center'>કોઈ કન્ટેન્ટ ઉપલબ્ધ નથી.</p>";
                } else {
                    contentDiv.innerHTML = "<p class='text-red-500 text-center'>પેજ મળ્યું નથી.</p>";
                }
            } catch (err) {
                console.error("પેજ કન્ટેન્ટ લોડ કરવામાં ભૂલ:", err);
                contentDiv.innerHTML = "<p class='text-red-500 text-center'>કન્ટેન્ટ લોડ કરવામાં સમસ્યા આવી.</p>";
            }
        }

        verifyAndLoad();
