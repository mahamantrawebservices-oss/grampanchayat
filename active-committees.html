<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>કાર્યરત સમિતિઓ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <!-- ૧. Developer Maintenance Screen (Hidden by default) -->
    <div id="maintenance-screen" class="hidden fixed inset-0 bg-slate-900 text-white z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 max-w-lg shadow-2xl space-y-4">
            <i class="fa-solid fa-screwdriver-wrench text-6xl text-amber-400 animate-bounce"></i>
            <h2 class="text-2xl font-bold text-amber-400">સિસ્ટમ મેન્ટેનન્સ ચાલુ છે</h2>
            <p id="maintenance-msg-text" class="text-gray-300 text-sm">
                હાલમાં ટેકનિકલ સુધારા અર્થે સિસ્ટમ મેન્ટેનન્સ મોડમાં છે. કૃપા કરીને થોડીવાર પછી પ્રયત્ન કરો.
            </p>
        </div>
    </div>

    <!-- ૨. Subscription Deactive Screen (Hidden by default) -->
    <div id="deactive-screen" class="hidden fixed inset-0 bg-gray-900/90 text-white z-40 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-white text-gray-800 p-8 rounded-3xl max-w-md shadow-2xl space-y-4">
            <i class="fa-solid fa-circle-exclamation text-6xl text-red-500"></i>
            <h2 class="text-xl font-bold text-red-600">સબ્સ્ક્રિપ્શન નિષ્ક્રિય છે (Deactive)</h2>
            <p class="text-gray-600 text-sm">
                આ ગ્રામ પંચાયતની વેબસાઇટ સેવા હાલ પૂરતી સ્થગિત કરવામાં આવી છે.
            </p>
        </div>
    </div>

    <header class="bg-gradient-to-r from-purple-900 via-pink-950 to-purple-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold text-amber-300 flex items-center gap-2">
                <i class="fa-solid fa-sitemap"></i> ગ્રામ પંચાયતની કાર્યરત સમિતિઓ
            </h1>
            <a id="back-home-btn" href="index.html" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">← મુખ્ય પૃષ્ઠ</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-5xl flex-grow space-y-6" id="committees-list">
        <p class="text-center text-gray-400">સમિતિઓ લોડ થઈ રહી છે...</p>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
            authDomain: "gram-panchayat-33c86.firebaseapp.com",
            projectId: "gram-panchayat-33c86",
            storageBucket: "gram-panchayat-33c86.firebasestorage.app",
            messagingSenderId: "1025176315779",
            appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
            measurementId: "G-TQBSXCWNBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const panchayatId = urlParams.get('id') || "ahmedabad_daskroi_motapipalva";

        // મુખ્ય પૃષ્ઠની લિંક સાથે panchayat id જાળવી રાખવા માટે
        document.getElementById("back-home-btn").href = `index.html?id=${panchayatId}`;

        async function verifyAndLoad() {
            try {
                // 1. Global Maintenance Check
                const maintSnap = await getDoc(doc(db, "system_settings", "global_config"));
                if (maintSnap.exists() && maintSnap.data().isMaintenance) {
                    document.getElementById("maintenance-screen").classList.remove("hidden");
                    if (maintSnap.data().maintenanceMessage) {
                        document.getElementById("maintenance-msg-text").textContent = maintSnap.data().maintenanceMessage;
                    }
                    return;
                }

                // 2. Panchayat Active Status Check
                const pSnap = await getDoc(doc(db, "panchayats", panchayatId));
                if (pSnap.exists() && pSnap.data().isActive === false) {
                    document.getElementById("deactive-screen").classList.remove("hidden");
                    return;
                }

                // 3. Load Committees Data
                loadCommittees();
            } catch (err) {
                console.error("Verification error:", err);
            }
        }

        async function loadCommittees() {
            const snap = await getDocs(collection(db, "panchayats", panchayatId, "active_committees"));
            const container = document.getElementById("committees-list");
            container.innerHTML = "";

            if (snap.empty) {
                container.innerHTML = `<p class="text-gray-500 text-center">કોઈ સમિતિ મળેલી નથી.</p>`;
                return;
            }

            snap.forEach(d => {
                const item = d.data();
                let membersRows = "";
                if(item.members && item.members.length > 0) {
                    item.members.forEach((m, idx) => {
                        membersRows += `
                            <tr class="hover:bg-gray-50 border-b border-purple-50">
                                <td class="p-2">${idx + 1}</td>
                                <td class="p-2 font-semibold text-gray-800">${m.name || '-'}</td>
                                <td class="p-2">${m.originalDesignation || '-'}</td>
                                <td class="p-2"><span class="bg-purple-100 text-purple-900 px-2 py-0.5 rounded font-bold text-xs">${m.committeeRole || '-'}</span></td>
                            </tr>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-md border border-purple-100 space-y-3">
                        <h2 class="text-base font-bold text-purple-950 border-b border-purple-100 pb-2 flex items-center gap-2">
                            <i class="fa-solid fa-users text-purple-700"></i> ${item.committeeName || '-'}
                        </h2>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs md:text-sm">
                                <thead>
                                    <tr class="bg-purple-50 text-purple-950">
                                        <th class="p-2">ક્રમ</th>
                                        <th class="p-2">સભ્યનું નામ</th>
                                        <th class="p-2">મૂળ હોદ્દો</th>
                                        <th class="p-2">સમિતિમાં હોદ્દો</th>
                                    </tr>
                                </thead>
                                <tbody>${membersRows}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
        }

        verifyAndLoad();
    </script>
</body>
</html>
