<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પંચાયત વિગત</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    /* દરેક પેરેગ્રાફની પહેલી લાઈનમાં ઓટોમેટિક જગ્યા (Indentation) છૂટશે */
    .ql-editor p, #page-content p {
        text-indent: 30px;
        margin-bottom: 12px;
        line-height: 1.6;
    }
</style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- ૧. Developer Maintenance Screen (Hidden by default) -->
    <div id="maintenance-screen" class="hidden fixed inset-0 bg-slate-900 text-white z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 max-w-lg shadow-2xl space-y-4">
            <i class="fa-solid fa-screwdriver-wrench text-6xl text-amber-400 animate-bounce"></i>
            <h2 class="text-2xl font-bold text-amber-400">સિસ્ટમ મેન્ટેનન્સ ચાલુ છે</h2>
            <p id="maintenance-msg-text" class="text-gray-300 text-sm">
                હાલમાં ટેકનિકલ સુધારા અર્થે સિસ્ટમ મેન્ટેનન્સ મોડમાં છે. કૃપા કરીને થોડીવાર પછી પ્રયત્ન કરો.
            </p>
        </div>
    </div>

    <!-- ૨. Subscription Deactive Screen (Hidden by default) -->
    <div id="deactive-screen" class="hidden fixed inset-0 bg-gray-900/90 text-white z-40 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-white text-gray-800 p-8 rounded-3xl max-w-md shadow-2xl space-y-4">
            <i class="fa-solid fa-circle-exclamation text-6xl text-red-500"></i>
            <h2 class="text-xl font-bold text-red-600">સબ્સ્ક્રિપ્શન નિષ્ક્રિય છે (Deactive)</h2>
            <p class="text-gray-600 text-sm">
                આ ગ્રામ પંચાયતની વેબસાઇટ સેવા હાલ પૂરતી સ્થગિત કરવામાં આવી છે.
            </p>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-gradient-to-r from-purple-900 via-indigo-900 to-purple-900 text-white shadow-lg p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 id="page-title" class="text-xl font-bold text-amber-300">વિગત લોડ થઈ રહી છે...</h1>
            <a id="back-home-btn" href="index.html" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">
                ← મુખ્ય પૃષ્ઠ પર પાછા જાઓ
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container mx-auto px-4 py-6 flex-grow">
        <div class="bg-white rounded-xl shadow-md p-6 border border-purple-100">
            <div id="page-content" class="text-gray-800 leading-relaxed space-y-4">
                <p class="text-center text-gray-500">ડેટા લોડ થઈ રહ્યો છે...</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
            authDomain: "gram-panchayat-33c86.firebaseapp.com",
            projectId: "gram-panchayat-33c86",
            storageBucket: "gram-panchayat-33c86.firebasestorage.app",
            messagingSenderId: "1025176315779",
            appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
            measurementId: "G-TQBSXCWNBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const panchayatId = urlParams.get('id') || "ahmedabad_daskroi_motapipalva";
        const menuId = urlParams.get('menuId') || urlParams.get('id'); // Support for both parameter styles

        // મુખ્ય પૃષ્ઠ લિંક સાથે પંચાયત ID જાળવી રાખવો
        document.getElementById("back-home-btn").href = `index.html?id=${panchayatId}`;

        async function verifyAndLoad() {
            try {
                // 1. Global Maintenance Check
                const maintSnap = await getDoc(doc(db, "system_settings", "global_config"));
                if (maintSnap.exists() && maintSnap.data().isMaintenance) {
                    document.getElementById("maintenance-screen").classList.remove("hidden");
                    if (maintSnap.data().maintenanceMessage) {
                        document.getElementById("maintenance-msg-text").textContent = maintSnap.data().maintenanceMessage;
                    }
                    return;
                }

                // 2. Panchayat Active Status Check
                const pSnap = await getDoc(doc(db, "panchayats", panchayatId));
                if (pSnap.exists() && pSnap.data().isActive === false) {
                    document.getElementById("deactive-screen").classList.remove("hidden");
                    return;
                }

                // 3. Load Detail Page Content
                loadDetailPage();
            } catch (err) {
                console.error("Verification error:", err);
            }
        }

        async function loadDetailPage() {
            const detailMenuId = urlParams.get('menuId') || urlParams.get('id');

            if (!detailMenuId || detailMenuId === panchayatId) {
                document.getElementById("page-title").innerText = "ભૂલ!";
                document.getElementById("page-content").innerHTML = "<p class='text-red-500'>કોઈ ચોક્કસ મેનૂ પસંદ કરેલ નથી.</p>";
                return;
            }

            try {
                const docRef = doc(db, "panchayats", panchayatId, "village_details", detailMenuId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("page-title").innerText = data.title || "પંચાયત વિગત";
                    document.getElementById("page-content").innerHTML = data.content || "<p>કોઈ માહિતી ઉપલબ્ધ નથી.</p>";
                } else {
                    document.getElementById("page-title").innerText = "માહિતી મળી નથી";
                    document.getElementById("page-content").innerHTML = "<p>આ વિભાગ માટે કોઈ ડેટા મળ્યો નથી.</p>";
                }
            } catch (err) {
                console.error("પેજ લોડ કરવામાં ભૂલ:", err);
                document.getElementById("page-title").innerText = "એરર";
                document.getElementById("page-content").innerHTML = "<p class='text-red-500'>માહિતી લોડ કરવામાં સમસ્યા આવી.</p>";
            }
        }

        verifyAndLoad();
    </script>
</body>
</html>
