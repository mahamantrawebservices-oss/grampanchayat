<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ગામનો નક્શો અને વિગતો</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="#">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-emerald-900 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">🗺️ ગામનો નક્શો અને વિગત</h1>
        <a href="index.html" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-1.5 rounded text-white font-bold transition">મુખ્ય પેજ પર જાઓ</a>
    </header>

    <main class="container mx-auto p-4 md:p-6 flex-1 flex flex-col space-y-4">
        
        <!-- ૩ મુખ્ય બટનો -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <button id="btn-gram" class="map-btn bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2 border-2 border-transparent">
                🏛️ ગામની માહિતી મેપ (Gram Manchitra)
            </button>

            <button id="btn-satellite" class="map-btn bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2 border-2 border-transparent">
                🛰️ સેટેલાઇટ મેપ (Google Map)
            </button>

            <button id="btn-revenue-pdf" class="map-btn bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2 border-2 border-transparent">
                📄 રેવન્યુ સર્વે નંબર મેપ (PDF)
            </button>
        </div>

        <!-- કન્ટેનર -->
        <div class="flex-1 bg-white rounded-2xl shadow-lg border p-2 min-h-[600px] relative flex flex-col overflow-hidden">
            <!-- Default Placeholder / Message View -->
            <div id="map-placeholder" class="hidden absolute inset-0 flex-col items-center justify-center bg-gray-50 p-6 text-center z-10">
                <p class="text-gray-600 font-semibold mb-3" id="placeholder-text">મહેરબાની કરીને ઉપરના વિકલ્પોમાંથી એક પસંદ કરો.</p>
                <a id="external-link-btn" href="#" target="_blank" class="hidden bg-blue-600 text-white text-xs px-4 py-2 rounded-lg font-bold shadow hover:bg-blue-700">
                    નવી ટેબમાં ખોલો ↗
                </a>
            </div>
            
            <iframe id="map-frame" class="w-full h-full min-h-[580px] rounded-xl border-0" src="https://grammanchitra.gov.in/"></iframe>
        </div>

    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
            authDomain: "gram-panchayat-33c86.firebaseapp.com",
            projectId: "gram-panchayat-33c86",
            storageBucket: "gram-panchayat-33c86.firebasestorage.app",
            messagingSenderId: "1025176315779",
            appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
            measurementId: "G-TQBSXCWNBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const frame = document.getElementById('map-frame');
        const placeholder = document.getElementById('map-placeholder');
        const placeholderText = document.getElementById('placeholder-text');
        const externalBtn = document.getElementById('external-link-btn');

        const btnGram = document.getElementById('btn-gram');
        const btnSat = document.getElementById('btn-satellite');
        const btnPdf = document.getElementById('btn-revenue-pdf');

        let satUrl = "";
        let pdfUrl = "";

        // Firestore માંથી લિંક્સ મેળવવી
        async function loadMapLinks() {
            try {
                const docRef = doc(db, "village_map_settings", "links");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    satUrl = data.satelliteUrl || "";
                    pdfUrl = data.revenuePdfUrl || "";
                    console.log("✅ લિંક્સ લોડ થઈ ગઈ:", { satUrl, pdfUrl });
                } else {
                    console.warn("⚠️ Firestore માં 'village_map_settings/links' નો ડેટા મળ્યો નથી.");
                }
            } catch (err) {
                console.error("❌ લિંક લોડ કરવામાં ભૂલ:", err);
            }
        }

        // Display update helper
        function showFrame(url) {
            placeholder.classList.add('hidden');
            frame.classList.remove('hidden');
            frame.src = url;
        }

        function showPlaceholder(message, link = null) {
            frame.classList.add('hidden');
            placeholder.classList.remove('hidden');
            placeholder.classList.add('flex');
            placeholderText.textContent = message;
            
            if (link) {
                externalBtn.href = link;
                externalBtn.classList.remove('hidden');
            } else {
                externalBtn.classList.add('hidden');
            }
        }

        // Active Button styling handler
        function setActiveButton(activeBtn) {
            [btnGram, btnSat, btnPdf].forEach(btn => {
                btn.classList.remove('ring-4', 'ring-offset-2', 'ring-gray-400');
            });
            activeBtn.classList.add('ring-4', 'ring-offset-2', 'ring-gray-400');
        }

        // Open URL logic
        function openUrl(url) {
            if (!url || url.trim() === "") {
                alert("એડમિન પેનલમાંથી આ લિંક હજુ સુધી ઉમેરવામાં આવી નથી.");
                return;
            }

            let finalUrl = url.trim();

            // Google Drive preview logic
            if (finalUrl.includes('drive.google.com') && finalUrl.includes('/view')) {
                finalUrl = finalUrl.replace('/view', '/preview');
            }

            // External Maps (Google Maps non-embed)
            if (finalUrl.includes('google.com/maps') && !finalUrl.includes('embed')) {
                window.open(finalUrl, '_blank');
                showPlaceholder("ગૂગલ મેપ નવી ટેબમાં ઓપન થઈ ગયો છે.", finalUrl);
            } else {
                showFrame(finalUrl);
            }
        }

        // Button Event Listeners
// Gram Manchitra બટન ક્લિક લોજિક
btnGram.addEventListener('click', () => { 
    setActiveButton(btnGram);
    
    // iframe ની બદલે નવી ટેબમાં લિંક ખોલવી
    window.open("https://grammanchitra.gov.in/", "_blank");
    
    // પ્લેસહોલ્ડર મેસેજ બતાવવો
    showPlaceholder("Gram Manchitra પોર્ટલ નવી ટેબમાં સફળતાપૂર્વક ખુલી ગયું છે.", "https://grammanchitra.gov.in/");
});

        btnSat.addEventListener('click', async () => { 
            setActiveButton(btnSat);
            if (!satUrl) await loadMapLinks(); 
            openUrl(satUrl); 
        });

        btnPdf.addEventListener('click', async () => { 
            setActiveButton(btnPdf);
            if (!pdfUrl) await loadMapLinks(); 
            openUrl(pdfUrl); 
        });

        // Initial Load
        loadMapLinks();
    </script>
</body>
</html>
