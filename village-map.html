<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ગામનો નક્શો અને વિગતો</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="#">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-emerald-900 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">🗺️ ગામનો નક્શો અને વિગત</h1>
        <a href="index.html" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-1.5 rounded text-white font-bold transition">મુખ્ય પેજ પર જાઓ</a>
    </header>

    <main class="container mx-auto p-4 md:p-6 flex-1 flex flex-col space-y-4">
        
        <!-- ૩ મુખ્ય બટનો -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <button id="btn-gram" class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2">
                🏛️ ગામની માહિતી મેપ (Gram Manchitra)
            </button>

            <button id="btn-satellite" class="bg-emerald-600 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2">
                🛰️ સેટેલાઇટ મેપ (Google Map)
            </button>

            <button id="btn-revenue-pdf" class="bg-purple-600 hover:bg-purple-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2">
                📄 રેવન્યુ સર્વે નંબર મેપ (PDF)
            </button>
        </div>

        <!-- કન્ટેનર -->
        <div class="flex-1 bg-white rounded-2xl shadow-lg border p-2 min-h-[600px] relative flex flex-col overflow-hidden">
            <iframe id="map-frame" class="w-full h-full min-h-[580px] rounded-xl border-0" src="https://grammanchitra.gov.in/"></iframe>
        </div>

    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

       // તમારી Firebase Details અહીં મૂકો
const firebaseConfig = {
  apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
  authDomain: "gram-panchayat-33c86.firebaseapp.com",
  projectId: "gram-panchayat-33c86",
  storageBucket: "gram-panchayat-33c86.firebasestorage.app",
  messagingSenderId: "1025176315779",
  appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
  measurementId: "G-TQBSXCWNBV"
};
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const frame = document.getElementById('map-frame');
        const btnGram = document.getElementById('btn-gram');
        const btnSat = document.getElementById('btn-satellite');
        const btnPdf = document.getElementById('btn-revenue-pdf');

        let satUrl = "";
        let pdfUrl = "";

        // Firestore માંથી લિંક્સ મેળવવી
        async function loadMapLinks() {
            try {
                const docRef = doc(db, "village_map_settings", "links");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    satUrl = data.satelliteUrl || "";
                    pdfUrl = data.revenuePdfUrl || "";
                    console.log("✅ લિંક સફળતાપૂર્વક લોડ થઈ ગઈ:", { satUrl, pdfUrl });
                } else {
                    console.warn("⚠️ એડમિન પેનલમાંથી લિંક હજુ સેવ કરવામાં આવી નથી.");
                }
            } catch (err) {
                console.error("❌ લિંક લોડ કરવામાં ભૂલ:", err);
            }
        }

        // લિંક ઓપન લોજિક
        function openUrl(url) {
            if (!url || url.trim() === "") {
                alert("એડમિન પેનલમાંથી આ લિંક હજુ સુધી ઉમેરવામાં આવી નથી.");
                return;
            }

            // જો સાદી ગૂગલ મેપ લિંક હોય તો નવી ટેબમાં ઓપન કરો
            if (url.includes('google.com/maps') && !url.includes('embed') && !url.includes('output=embed')) {
                window.open(url, '_blank');
            } else if (url.includes('drive.google.com') && url.includes('/view')) {
                frame.src = url.replace('/view', '/preview');
            } else {
                frame.src = url;
            }
        }

        btnGram.addEventListener('click', () => { 
            frame.src = "https://grammanchitra.gov.in/gm4MVC"; 
        });

        btnSat.addEventListener('click', async () => { 
            if (!satUrl) await loadMapLinks(); 
            openUrl(satUrl); 
        });

        btnPdf.addEventListener('click', async () => { 
            if (!pdfUrl) await loadMapLinks(); 
            openUrl(pdfUrl); 
        });

        // પેજ લોડ થતાં જ લિંક્સ ફેચ કરી લેવી
        loadMapLinks();
    </script>
</body>
</html>
