<script type="module">
    import { db } from './js/firebase-config.js';
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const frame = document.getElementById('map-frame');
    const btnGram = document.getElementById('btn-gram');
    const btnSat = document.getElementById('btn-satellite');
    const btnPdf = document.getElementById('btn-revenue-pdf');

    let satUrl = "";
    let pdfUrl = "";
    let isDataLoaded = false;

    // Firebase Firestore માંથી એડમિન દ્વારા સેવ કરાયેલી લિંક્સ લોડ કરવી
    async function loadMapLinks() {
        try {
            const docRef = doc(db, "village_map_settings", "links");
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                satUrl = data.satelliteUrl || "";
                pdfUrl = data.revenuePdfUrl || "";
                isDataLoaded = true;
                console.log("લોડ થયેલી લિંક્સ:", { satUrl, pdfUrl });
            } else {
                console.warn("Firestore માં 'village_map_settings/links' નામનો ડૉક્યુમેન્ટ મળ્યો નથી.");
            }
        } catch (err) {
            console.error("Firebase માંથી લિંક લોડ કરવામાં ભૂલ આવે છે:", err);
        }
    }

    // ૧. ગ્રામ મંચિત્ર બટન
    btnGram.addEventListener('click', () => {
        frame.src = "https://grammanchitra.gov.in/";
    });

    // ૨. સેટેલાઇટ મેપ બટન
    btnSat.addEventListener('click', async () => {
        if (!isDataLoaded) await loadMapLinks(); // જો ડેટા લોડ થવામાં સમય લાગ્યો હોય તો ફરી ટ્રાય કરો

        if (satUrl && satUrl.trim() !== "") {
            frame.src = satUrl;
        } else {
            alert("સેટેલાઇટ મેપ લિંક એડમિન પેનલમાંથી સેટ કરેલી નથી. કૃપા કરીને એડમિન પેનલમાં જઈ લિંક ઉમેરી સેવ કરો.");
        }
    });

    // ૩. રેવન્યુ સર્વે નંબર PDF બટન
    btnPdf.addEventListener('click', async () => {
        if (!isDataLoaded) await loadMapLinks();

        if (pdfUrl && pdfUrl.trim() !== "") {
            frame.src = pdfUrl;
        } else {
            alert("રેવન્યુ PDF લિંક એડમિન પેનલમાંથી સેટ કરેલી નથી. કૃપા કરીને એડમિન પેનલમાં જઈ લિંક ઉમેરી સેવ કરો.");
        }
    });

    // પેજ લોડ થતાં જ કનેક્શન શરૂ કરો
    loadMapLinks();
</script>
