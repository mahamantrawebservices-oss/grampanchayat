<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ગામનો નક્શો અને વિગતો</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-emerald-900 text-white py-4 px-6 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">🗺️ ગામનો નક્શો અને વિગત</h1>
        <a href="index.html" class="bg-emerald-700 hover:bg-emerald-800 text-xs px-3 py-1.5 rounded text-white font-bold transition">મુખ્ય પેજ પર જાઓ</a>
    </header>

    <main class="container mx-auto p-4 md:p-6 flex-1 flex flex-col space-y-4">
        
        <!-- ૩ મુખ્ય બટનો -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <!-- બટન ૧: ગ્રામ મંચિત્ર -->
            <button id="btn-gram" 
               class="bg-blue-600 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2">
                🏛️ ગામની માહિતી મેપ (Gram Manchitra)
            </button>

            <!-- બટન ૨: સેટેલાઇટ મેપ -->
            <button id="btn-satellite" 
               class="bg-emerald-600 hover:bg-emerald-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2">
                🛰️ સેટેલાઇટ મેપ (Google Map)
            </button>

            <!-- બટન ૩: રેવન્યુ સર્વે નંબર PDF -->
            <button id="btn-revenue-pdf" 
               class="bg-purple-600 hover:bg-purple-800 text-white font-bold py-3 px-4 rounded-xl shadow transition text-center flex items-center justify-center gap-2">
                📄 રેવન્યુ સર્વે નંબર મેપ (PDF)
            </button>

        </div>

        <!-- સમાન ટેબમાં માહિતી / મેપ / PDF દર્શાવવા માટેનું Container -->
        <div class="flex-1 bg-white rounded-2xl shadow-lg border p-2 min-h-[600px] relative flex flex-col overflow-hidden">
            
            <!-- દર્શાવવા માટેનું Iframe -->
            <iframe id="map-frame" class="w-full h-full min-h-[580px] rounded-xl border-0" src="https://grammanchitra.gov.in/"></iframe>

            <!-- લિંક બ્લોક થાય ત્યારે બતાવવા માટેનો વિકલ્પ -->
            <div id="fallback-box" class="hidden absolute inset-0 bg-white flex flex-col items-center justify-center p-6 text-center space-y-4">
                <div class="text-4xl">🔗</div>
                <h3 class="text-lg font-bold text-gray-800">આ પેજ સુરક્ષા કારણોસર સમાન ફ્રેમમાં લોડ થઈ શકતું નથી.</h3>
                <p class="text-xs text-gray-500 max-w-md">મેપ અથવા PDF જોવા માટે નીચે આપેલા બટન પર ક્લિક કરો:</p>
                <a id="fallback-link" href="#" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-bold shadow-md transition">
                    અહીં ક્લિક કરીને ડાયરેક્ટ ખોલો ↗
                </a>
            </div>

        </div>

    </main>

    <!-- Firebase Script -->
    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const frame = document.getElementById('map-frame');
        const fallbackBox = document.getElementById('fallback-box');
        const fallbackLink = document.getElementById('fallback-link');

        const btnGram = document.getElementById('btn-gram');
        const btnSat = document.getElementById('btn-satellite');
        const btnPdf = document.getElementById('btn-revenue-pdf');

        let satUrl = "";
        let pdfUrl = "";

        // Firestore માંથી એડમિન દ્વારા સેવ કરાયેલી લિંક્સ લોડ કરવી
        async function loadMapLinks() {
            try {
                const docRef = doc(db, "village_map_settings", "links");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    satUrl = data.satelliteUrl || "";
                    pdfUrl = data.revenuePdfUrl || "";
                }
            } catch (err) {
                console.error("લિંક લોડ કરવામાં ભૂલ:", err);
            }
        }

        // ફ્રેમ અપડેટ કરવાનું ફંક્શન
        function updateDisplay(url, isOpenDirect = false) {
            if (!url || url.trim() === "") {
                alert("એડમિન પેનલમાંથી આ લિંક હજુ સુધી ઉમેરવામાં આવી નથી.");
                return;
            }

            if (isOpenDirect) {
                // Google Maps કે અન્ય સિક્યોર લિંક્સ માટે વિકલ્પ બતાવવો
                frame.classList.add('hidden');
                fallbackBox.classList.remove('hidden');
                fallbackLink.href = url;
            } else {
                fallbackBox.classList.add('hidden');
                frame.classList.remove('hidden');
                frame.src = url;
            }
        }

        // ૧. ગ્રામ મંચિત્ર બટન
        btnGram.addEventListener('click', () => {
            updateDisplay("https://grammanchitra.gov.in/");
        });

        // ૨. સેટેલાઇટ મેપ બટન
        btnSat.addEventListener('click', async () => {
            if (!satUrl) await loadMapLinks();
            
            // જો લિંક Embeddable ન હોય (જેમ કે સાદી maps.google.com લિંક), તો ડાયરેક્ટ ઓપન વિકલ્પ બતાવો
            if (satUrl.includes('google.com/maps') && !satUrl.includes('embed')) {
                updateDisplay(satUrl, true);
            } else {
                updateDisplay(satUrl, false);
            }
        });

        // ૩. રેવન્યુ સર્વે નંબર PDF બટન
        btnPdf.addEventListener('click', async () => {
            if (!pdfUrl) await loadMapLinks();

            // Google Drive વાળી PDF હોય તો તેને પણ યોગ્ય રીતે બતાવવી
            if (pdfUrl.includes('drive.google.com') && pdfUrl.includes('/view')) {
                let embedPdf = pdfUrl.replace('/view', '/preview');
                updateDisplay(embedPdf, false);
            } else {
                updateDisplay(pdfUrl, false);
            }
        });

        // શરૂઆતમાં લિંક્સ લોડ કરો
        loadMapLinks();
    </script>
</body>
</html>
