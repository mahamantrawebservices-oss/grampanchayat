<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પંચાયત કમિટી અને સ્ટાફ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-blue-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold text-amber-300 flex items-center gap-2">
                <i class="fa-solid fa-users-gear"></i> પંચાયત કમિટી અને સ્ટાફ
            </h1>
            <a href="index.html" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow">← મુખ્ય પૃષ્ઠ</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 space-y-8 max-w-5xl flex-grow">
        
        <!-- ભાગ ૧: ચૂંટાયેલ પંચાયત કમિટી -->
        <section class="bg-white p-5 rounded-2xl shadow-md border border-blue-100 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-blue-100 pb-2">
                <h2 class="text-lg font-bold text-blue-950 flex items-center gap-2">
                    <i class="fa-solid fa-user-tie text-blue-700"></i> ૧. ચૂંટાયેલ પંચાયત કમિટી
                </h2>
                <span id="term-info" class="text-xs bg-amber-100 text-amber-900 border border-amber-300 font-bold px-3 py-1 rounded-full mt-1 sm:mt-0">
                    મુદત: લોડ થઈ રહી છે...
                </span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs md:text-sm border-collapse">
                    <thead>
                        <tr class="bg-blue-50 text-blue-950 border-b border-blue-200">
                            <th class="p-2.5">ક્રમ</th>
                            <th class="p-2.5">નામ</th>
                            <th class="p-2.5">હોદ્દો</th>
                            <th class="p-2.5">વોર્ડ નં.</th>
                            <th class="p-2.5">મોબાઈલ નંબર</th>
                        </tr>
                    </thead>
                    <tbody id="committee-table-body" class="divide-y divide-gray-100">
                        <tr><td colspan="5" class="p-3 text-center text-gray-400">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- ભાગ ૨: ગ્રામ પંચાયત કર્મચારીઓ -->
        <section class="bg-white p-5 rounded-2xl shadow-md border border-indigo-100 space-y-4">
            <h2 class="text-lg font-bold text-indigo-950 border-b border-indigo-100 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-address-book text-indigo-700"></i> ૨. ગ્રામ પંચાયત કર્મચારીઓ
            </h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs md:text-sm border-collapse">
                    <thead>
                        <tr class="bg-indigo-50 text-indigo-950 border-b border-indigo-200">
                            <th class="p-2.5">ક્રમ</th>
                            <th class="p-2.5">કર્મચારીનું નામ</th>
                            <th class="p-2.5">હોદ્દો</th>
                            <th class="p-2.5">મોબાઈલ નંબર</th>
                        </tr>
                    </thead>
                    <tbody id="staff-table-body" class="divide-y divide-gray-100">
                        <tr><td colspan="4" class="p-3 text-center text-gray-400">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- નોંધ -->
        <div id="staff-note-box" class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl text-xs text-amber-900 hidden">
            <b>નોંધ:</b> <span id="staff-note-text"></span>
        </div>

    </main>

    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { doc, getDoc, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        async function loadData() {
            // મુદત અને નોંધ
            const metaDoc = await getDoc(doc(db, "panchayat_meta", "staff_page"));
            if (metaDoc.exists()) {
                document.getElementById("term-info").innerText = "મુદત: " + (metaDoc.data().term || "-");
                if (metaDoc.data().note) {
                    document.getElementById("staff-note-box").classList.remove("hidden");
                    document.getElementById("staff-note-text").innerText = metaDoc.data().note;
                }
            }

            // ૧. કમિટી સભ્યો
            const commSnap = await getDocs(query(collection(db, "panchayat_committee"), orderBy("order", "asc")));
            const commBody = document.getElementById("committee-table-body");
            commBody.innerHTML = "";
            let idx1 = 1;
            commSnap.forEach(d => {
                const item = d.data();
                commBody.innerHTML += `<tr class="hover:bg-gray-50"><td class="p-2.5">${idx1++}</td><td class="p-2.5 font-semibold text-gray-800">${item.name}</td><td class="p-2.5"><span class="bg-blue-100 text-blue-900 px-2 py-0.5 rounded font-bold text-xs">${item.designation}</span></td><td class="p-2.5">${item.ward || '-'}</td><td class="p-2.5">${item.mobile}</td></tr>`;
            });

            // ૨. કર્મચારીઓ
            const staffSnap = await getDocs(query(collection(db, "panchayat_staff"), orderBy("order", "asc")));
            const staffBody = document.getElementById("staff-table-body");
            staffBody.innerHTML = "";
            let idx2 = 1;
            staffSnap.forEach(d => {
                const item = d.data();
                staffBody.innerHTML += `<tr class="hover:bg-gray-50"><td class="p-2.5">${idx2++}</td><td class="p-2.5 font-semibold text-gray-800">${item.name}</td><td class="p-2.5"><span class="bg-indigo-100 text-indigo-900 px-2 py-0.5 rounded font-bold text-xs">${item.designation}</span></td><td class="p-2.5">${item.mobile}</td></tr>`;
            });
        }
        loadData();
    </script>
</body>
</html>
