<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>સુપર એડમિન પેનલ - ગ્રામ પંચાયત મેનેજમેન્ટ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans text-gray-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">

        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 rounded-2xl shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-amber-400"></i> સુપર એડમિન કંટ્રોલ પેનલ
                </h1>
                <p class="text-xs text-slate-400 mt-1">ગુજરાતની ગ્રામ પંચાયતોનું સેન્ટ્રલ મેનેજમેન્ટ અને વન-ટાઇમ લિંક કંટ્રોલ</p>
            </div>
            <div class="flex gap-3">
                <span id="total-panchayats-count" class="bg-slate-800 px-4 py-2 rounded-xl text-xs font-semibold text-emerald-400 border border-slate-700">
                    કુલ પંચાયતો: ૦
                </span>
            </div>
        </div>

        <!-- Developer Maintenance Manager Section -->
        <div class="bg-amber-50 border border-amber-300 p-5 rounded-2xl shadow-sm space-y-4">
            <h3 class="font-bold text-amber-900 text-sm flex items-center gap-2 border-b border-amber-200 pb-2">
                <i class="fa-solid fa-screwdriver-wrench text-amber-600"></i> ડેવલપર મેન્ટેનન્સ મેસેજ કંટ્રોલ (Global Maintenance Mode)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end text-xs">
                <div>
                    <label class="block font-medium text-amber-900 mb-1">મેન્ટેનન્સ મોડ સ્વિચ:</label>
                    <select id="maint-mode-select" class="w-full border p-2 rounded-lg bg-white font-bold">
                        <option value="false">OFF (વેબસાઇટ્સ ચાલુ રાખવી)</option>
                        <option value="true">ON (મેન્ટેનન્સ મોડ ચાલુ કરવો)</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block font-medium text-amber-900 mb-1">નાગરિકો માટે મેન્ટેનન્સ મેસેજ:</label>
                    <input type="text" id="maint-msg-input" class="w-full border p-2 rounded-lg bg-white" placeholder="દા.ત. સિસ્ટમ અપડેટ ચાલુ હોવાથી વેબસાઇટ થોડીવાર માટે બંધ રહેશે.">
                </div>
            </div>
            <button id="save-maint-btn" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> મેન્ટેનન્સ સેટિંગ્સ સેવ કરો
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Form: Register New Panchayat -->
            <div class="bg-white p-5 rounded-2xl shadow-md border space-y-4">
                <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2 border-b pb-2">
                    <i class="fa-solid fa-plus-circle text-emerald-600"></i> નવી પંચાયત ઉમેરો
                </h3>

                <form id="add-panchayat-form" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">જિલ્લો (District):</label>
                        <input type="text" id="p-district" class="w-full border p-2 rounded bg-gray-50" placeholder="દા.ત. અમદાવાદ" required>
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">તાલુકો (Taluka):</label>
                        <input type="text" id="p-taluka" class="w-full border p-2 rounded bg-gray-50" placeholder="દા.ત. દસ્કોઈ" required>
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">ગ્રામ પંચાયતનું નામ:</label>
                        <input type="text" id="p-name" class="w-full border p-2 rounded bg-gray-50" placeholder="દા.ત. મોટા પીપળવા" required>
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">તલાટી/સંપર્ક નંબર:</label>
                        <input type="text" id="p-phone" class="w-full border p-2 rounded bg-gray-50" placeholder="મોબાઈલ નંબર">
                    </div>
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">એક્ટિવેશન સ્ટેટસ:</label>
                        <select id="p-status" class="w-full border p-2 rounded bg-gray-50 font-bold">
                            <option value="true">Active (વેબસાઇટ ચાલુ રાખવી)</option>
                            <option value="false">Deactive (પેન્ડિંગ/બંધ રાખવી)</option>
                        </select>
                    </div>

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-2.5 rounded-lg shadow transition mt-2 flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> પંચાયત ઉમેરો
                    </button>
                </form>
            </div>

            <!-- List of Panchayats -->
            <div class="md:col-span-2 bg-white p-5 rounded-2xl shadow-md border space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b pb-2">
                    <h3 class="font-bold text-sm text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-600"></i> નોંધાયેલ ગ્રામ પંચાયતોની યાદી
                    </h3>
                    <div class="flex gap-2 text-xs">
                        <input type="text" id="search-input" placeholder="શોધો (જિલ્લો/તાલુકો/ગામ)..." class="border p-1.5 rounded-lg w-48">
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 border-b">
                                <th class="p-2.5">જિલ્લો / તાલુકો</th>
                                <th class="p-2.5">ગ્રામ પંચાયત</th>
                                <th class="p-2.5 text-center">સ્ટેટસ</th>
                                <th class="p-2.5 text-center">મુખ્ય વેબસાઇટ લિંક</th>
                            </tr>
                        </thead>
                        <tbody id="panchayat-table-body">
                            <tr><td colspan="4" class="p-4 text-center text-gray-500">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <!-- DIRECT FIREBASE EMBEDDED MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Direct Firebase Configuration Key
        const firebaseConfig = {
            apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
            authDomain: "gram-panchayat-33c86.firebaseapp.com",
            projectId: "gram-panchayat-33c86",
            storageBucket: "gram-panchayat-33c86.firebasestorage.app",
            messagingSenderId: "1025176315779",
            appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
            measurementId: "G-TQBSXCWNBV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Helper for Document ID Generation
        function generateDocId(district, taluka, panchayat) {
            return `${district}_${taluka}_${panchayat}`
                .toLowerCase()
                .trim()
                .replace(/\s+/g, "_")
                .replace(/[^\w_]/g, "");
        }

        // Maintenance Settings Elements
        const maintModeSelect = document.getElementById("maint-mode-select");
        const maintMsgInput = document.getElementById("maint-msg-input");
        const saveMaintBtn = document.getElementById("save-maint-btn");

        // Load Maintenance Settings
        async function loadMaintenanceSettings() {
            try {
                const snap = await getDoc(doc(db, "system_settings", "global_config"));
                if (snap.exists()) {
                    const data = snap.data();
                    maintModeSelect.value = data.isMaintenance ? "true" : "false";
                    maintMsgInput.value = data.maintenanceMessage || "";
                }
            } catch (err) {
                console.error("Error loading system settings:", err);
            }
        }

        // Save Maintenance Settings
        saveMaintBtn.addEventListener("click", async () => {
            try {
                const isMaintenance = maintModeSelect.value === "true";
                const maintenanceMessage = maintMsgInput.value.trim();

                await setDoc(doc(db, "system_settings", "global_config"), {
                    isMaintenance,
                    maintenanceMessage,
                    updatedAt: new Date()
                });

                alert("ડેવલપર મેન્ટેનન્સ સેટિંગ્સ સેવ થઈ ગયા!");
            } catch (err) {
                console.error("Error saving maintenance settings:", err);
                alert("સેટિંગ્સ સેવ કરવામાં ભૂલ આવી.");
            }
        });

        // Add Panchayat Form Handler
        const addForm = document.getElementById("add-panchayat-form");
        addForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                const district = document.getElementById("p-district").value.trim();
                const taluka = document.getElementById("p-taluka").value.trim();
                const panchayatName = document.getElementById("p-name").value.trim();
                const phone = document.getElementById("p-phone").value.trim();
                const isActive = document.getElementById("p-status").value === "true";

                const docId = generateDocId(district, taluka, panchayatName);

                await setDoc(doc(db, "panchayats", docId), {
                    district,
                    taluka,
                    panchayatName,
                    phone,
                    isActive,
                    createdAt: new Date()
                });

                alert(`${panchayatName} ગ્રામ પંચાયત સફળતાપૂર્વક ઉમેરાઈ ગઈ!`);
                addForm.reset();
            } catch (err) {
                console.error("Error adding panchayat:", err);
                alert("પંચાયત ઉમેરવામાં ભૂલ આવી: " + err.message);
            }
        });

        // Real-time List Fetching & Render
        let allPanchayats = [];
        onSnapshot(collection(db, "panchayats"), (snapshot) => {
            allPanchayats = [];
            snapshot.forEach(docSnap => {
                allPanchayats.push({ id: docSnap.id, ...docSnap.data() });
            });

            document.getElementById("total-panchayats-count").textContent = `કુલ પંચાયતો: ${allPanchayats.length}`;
            renderPanchayatTable(allPanchayats);
        });

        // Render Table Function with Dynamic Link Generation
        function renderPanchayatTable(list) {
            const tbody = document.getElementById("panchayat-table-body");
            if (!list.length) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-gray-500">કોઈ પંચાયત ઉમેરાયેલ નથી.</td></tr>`;
                return;
            }

            const baseUrl = window.location.origin + window.location.pathname.replace("super-admin.html", "index.html");

            tbody.innerHTML = list.map(item => {
                const shareUrl = `${baseUrl}?id=${item.id}`;
                return `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-2.5 font-semibold text-gray-800">${item.district || '-'} / ${item.taluka || '-'}</td>
                    <td class="p-2.5 font-bold text-emerald-800">
                        ${item.panchayatName || '-'}
                        <div class="text-[10px] text-gray-500 font-normal">ફોન: ${item.phone || '-'}</div>
                    </td>
                    <td class="p-2.5 text-center">
                        <button onclick="togglePanchayatStatus('${item.id}', ${item.isActive})" 
                            class="px-2.5 py-1 rounded-full text-[10px] font-bold shadow transition ${item.isActive ? 'bg-emerald-100 text-emerald-800 border border-emerald-300 hover:bg-emerald-200' : 'bg-red-100 text-red-800 border border-red-300 hover:bg-red-200'}">
                            ${item.isActive ? 'Active (ON)' : 'Deactive (OFF)'}
                        </button>
                    </td>
                    <td class="p-2.5 text-center space-x-1">
                        <a href="${shareUrl}" target="_blank" class="inline-block bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded font-bold hover:bg-blue-100 text-[11px]" title="ખોલીને જુઓ">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> ખોલો
                        </a>
                        <button onclick="copyPanchayatLink('${shareUrl}')" class="bg-slate-100 text-slate-700 border border-slate-300 px-2 py-1 rounded font-bold hover:bg-slate-200 text-[11px]" title="WhatsApp માં શેર કરવા માટે લિંક કોપી કરો">
                            <i class="fa-solid fa-copy text-slate-600"></i> લિંક કોપી
                        </button>
                    </td>
                </tr>
            `}).join("");
        }

        // Global function to Toggle Status
        window.togglePanchayatStatus = async (id, currentStatus) => {
            try {
                await updateDoc(doc(db, "panchayats", id), {
                    isActive: !currentStatus
                });
            } catch (err) {
                console.error("Error updating status:", err);
            }
        };

        // Global function to Copy Shareable Link
        window.copyPanchayatLink = (link) => {
            navigator.clipboard.writeText(link).then(() => {
                alert("ગ્રામ પંચાયતની લિંક કોપી થઈ ગઈ છે! હવે તમે WhatsApp કે અન્ય જગ્યાએ શેર કરી શકો છો.\n\n" + link);
            }).catch(err => {
                console.error("Copy failed:", err);
            });
        };

        // Search Filter
        document.getElementById("search-input")?.addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allPanchayats.filter(p => 
                (p.district && p.district.toLowerCase().includes(query)) ||
                (p.taluka && p.taluka.toLowerCase().includes(query)) ||
                (p.panchayatName && p.panchayatName.toLowerCase().includes(query))
            );
            renderPanchayatTable(filtered);
        });

        loadMaintenanceSettings();
    </script>
</body>
</html>
