<script type="module">
    // પ્રોજેક્ટની મુખ્ય ફાઇલમાંથી (કે જ્યાંથી db એક્સપોર્ટ થતું હોય) db ઈમ્પોર્ટ કરો
    // જો તમારી main.js કે firebase.js માં db હોય તો ત્યાંથી પાથ સેટ કરવો, દા.ત. "./script.js" અથવા સીધું ફાયરબેઝ SDK:
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // નોંધ: જો તમારા પ્રોજેક્ટમાં બીજા પેજ પર જે firebaseConfig વાપરો છો એ જ અહીં વાપરવું

    // જો ઉપર config ના નાખવું હોય અને ગ્લોબલ db ઉપલબ્ધ હોય તો સીધુ નીચે મુજબ ઓનસ્નેપશોટ કામ કરશે:
    // (તમારા બાકીના JS ફાઇલ્સની જેમ જ db કનેક્શન અહીં પણ હોવું જરૂરી છે)

    import { db } from "./script.js"; // અથવા તમારી ફાયરબેઝ કનેક્ટ કરતી ફાઇલનો પાથ અહીં આપવો

    function loadPublicGlance() {
        const container = document.getElementById("public-glance-container");
        if (!container) return;

        onSnapshot(collection(db, "village_glance"), (snapshot) => {
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-gray-500 text-xs">હાલમાં કોઈ માહિતી ઉપલબ્ધ નથી.</div>`;
                return;
            }

            let sections = {};
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const secName = data.sectionName || "અન્ય માહિતી";
                if (!sections[secName]) sections[secName] = [];
                sections[secName].push(data);
            });

            for (let sectionName in sections) {
                let rowsHtml = sections[sectionName].map(item => `
                    <tr class="border-b hover:bg-gray-50 text-xs">
                        <td class="p-3 font-semibold text-gray-800 w-1/3">${item.title || '-'}</td>
                        <td class="p-3 text-emerald-700 font-bold w-1/3">${item.value || '-'}</td>
                        <td class="p-3 text-gray-600 text-[11px] w-1/3">${item.extraInfo || '-'}</td>
                    </tr>
                `).join("");

                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md border overflow-hidden mb-4">
                        <div class="bg-emerald-800 text-white px-4 py-3 font-bold text-sm flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-amber-300"></i> ${sectionName}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-emerald-50 text-emerald-900 text-xs border-b">
                                        <th class="p-3">વિગત / સુવિધા</th>
                                        <th class="p-3">આંકડો / મુખ્ય માહિતી</th>
                                        <th class="p-3">વધારાની વિગત (શિક્ષક/બાળકો વગેરે)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }, (error) => {
            console.error("Glance Load Error:", error);
            container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-red-500 text-xs">માહિતી લોડ કરવામાં એરર આવી.</div>`;
        });
    }

    // પેજ લોડ થતા જ કોલ કરો
    loadPublicGlance();
</script>
