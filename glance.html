<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>મારૂ ગામ - એક નજરમાં (Village at a Glance)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="#">
</head>
<body class="bg-slate-50 min-h-screen py-8 px-4 font-sans">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-emerald-700 text-white p-6 rounded-2xl shadow-lg text-center space-y-2">
            <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
                <i class="fa-solid fa-landmark"></i> મારૂ ગામ - એક નજરમાં (Village at a Glance)
            </h1>
            <p class="text-xs text-emerald-100">ગામની ભૌગોલિક, શૈક્ષણિક અને પાયાની સુવિધાઓની સત્તાવાર માહિતી</p>
        </div>

        <!-- Dynamic Data Container -->
        <div id="public-glance-container" class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow text-center text-gray-500 text-xs">
                માહિતી લોડ થઈ રહી છે...
            </div>
        </div>
    </div>

    <!-- Firebase Direct Config (404 Error ની કોઈ શક્યતા નહીં) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // તમારી ફાયરબેઝ કોન્ફિગ કી (જે તમારી firebase-config.js માં છે તે જ અહીં મૂકો)
const firebaseConfig = {
  apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
  authDomain: "gram-panchayat-33c86.firebaseapp.com",
  projectId: "gram-panchayat-33c86",
  storageBucket: "gram-panchayat-33c86.firebasestorage.app",
  messagingSenderId: "1025176315779",
  appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
  measurementId: "G-TQBSXCWNBV"
};
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const container = document.getElementById("public-glance-container");

        // Real-time Data Fetching
        onSnapshot(collection(db, "village_glance"), (snapshot) => {
            container.innerHTML = "";

            if (snapshot.empty) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-gray-500 text-xs">હાલમાં કોઈ માહિતી ઉપલબ્ધ નથી.</div>`;
                return;
            }

            let sections = {};
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const secName = data.sectionName || "અન્ય માહિતી";
                if (!sections[secName]) sections[secName] = [];
                sections[secName].push(data);
            });

            for (let sectionName in sections) {
                let rowsHtml = sections[sectionName].map(item => `
                    <tr class="border-b hover:bg-gray-50 text-xs">
                        <td class="p-3 font-semibold text-gray-800 w-1/3">${item.title || '-'}</td>
                        <td class="p-3 text-emerald-700 font-bold w-1/3">${item.value || '-'}</td>
                        <td class="p-3 text-gray-600 text-[11px] w-1/3">${item.extraInfo || '-'}</td>
                    </tr>
                `).join("");

                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md border overflow-hidden mb-4">
                        <div class="bg-emerald-800 text-white px-4 py-3 font-bold text-sm flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-amber-300"></i> ${sectionName}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-emerald-50 text-emerald-900 text-xs border-b">
                                        <th class="p-3">વિગત / સુવિધા</th>
                                        <th class="p-3">આંકડો / મુખ્ય માહિતી</th>
                                        <th class="p-3">વધારાની વિગત (શિક્ષક/બાળકો વગેરે)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }, (error) => {
            console.error("Glance Load Error:", error);
            container.innerHTML = `<div class="bg-white p-6 rounded-xl shadow text-center text-red-500 text-xs">માહિતી લોડ કરવામાં એરર આવી: ${error.message}</div>`;
        });
    </script>
</body>
</html>
