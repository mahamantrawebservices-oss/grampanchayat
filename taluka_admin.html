<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>તાલુકા એડમિન પેનલ - ગ્રામ પંચાયત પોર્ટલ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Taluka Login Modal -->
    <div id="taluka-login-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h2 class="text-2xl font-bold text-gray-800 mb-1 text-center">તાલુકા એડમિન લૉગિન</h2>
            <p class="text-xs text-center text-emerald-700 font-bold mb-4">પંચાયત મોનિટરિંગ પોર્ટલ</p>
            
            <form id="taluka-login-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">તાલુકાનું નામ (ID)</label>
                    <input type="text" id="login-taluka-name" placeholder="દા.ત. Daskroi કે Ahmedabad" required class="w-full border p-2.5 rounded text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">તાલુકા પાસવર્ડ</label>
                    <div class="relative">
                        <input type="password" id="login-taluka-password" placeholder="પાસવર્ડ દાખલ કરો" required class="w-full border p-2.5 pr-10 rounded text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        <button type="button" id="toggle-taluka-pass" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-gray-700">
                            <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2.5 rounded hover:bg-emerald-700 transition mt-2">લૉગિન કરો</button>
            </form>
        </div>
    </div>

    <!-- Taluka Admin Dashboard (Initially Hidden) -->
    <div id="taluka-dashboard" class="hidden min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="bg-emerald-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold" id="taluka-header-title">તાલુકા પંચાયત એડમિન પેનલ</h1>
                <p class="text-xs text-emerald-200">ગ્રાઉન્ડ લેવલ પંચાયત ડેટા મોનિટરિંગ</p>
            </div>
            <button id="logout-btn" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> લોગઆઉટ
            </button>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                <h2 class="text-lg font-bold text-emerald-900">આ તાલુકા હેઠળ આવતી તમામ ગ્રામ પંચાયતો</h2>
                <span id="total-panchayats-count" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-3 py-1 rounded-full">કુલ પંચાયતો: 0</span>
            </div>

            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead class="bg-emerald-800 text-white text-xs">
                            <tr>
                                <th class="p-3">ક્રમ</th>
                                <th class="p-3">LGD કોડ / ID</th>
                                <th class="p-3">ગ્રામ પંચાયતનું નામ</th>
                                <th class="p-3 text-center">માહિતી જોવા માટેના બટનો</th>
                                <th class="p-3 text-center">વેબસાઇટ લિંક</th>
                            </tr>
                        </thead>
                        <tbody id="taluka-panchayats-table-body" class="divide-y divide-gray-200 text-xs">
                            <tr><td colspan="5" class="p-4 text-center text-gray-500">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

<!-- Data Detail Popup Modal -->
    <div id="data-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-3xl relative max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-3 border-b pb-3">
                <h3 id="modal-title" class="font-bold text-emerald-900 text-lg">માહિતી</h3>
                <button onclick="closeDataModal()" class="text-gray-500 hover:text-red-600 font-bold text-xl px-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <!-- અહીં ટેબલ ફોર્મેટમાં ડેટા દેખાશે -->
            <div id="modal-content" class="flex-1 overflow-y-auto text-sm text-gray-800 space-y-4 pr-1 font-sans">
                માહિતી લોડ થઈ રહી છે...
            </div>
            
            <div class="mt-4 pt-3 border-t flex justify-end gap-2">
                <button onclick="copyModalContent()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-5 py-2.5 rounded-lg shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-copy"></i> ટેબલ / માહિતી કોપી કરો
                </button>
                <button onclick="closeDataModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold px-4 py-2.5 rounded-lg transition">
                    બંધ કરો
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Scripts Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMhWWI_6oxPIVEQEVlq2SIBf72EI2o8NI",
            authDomain: "gram-panchayat-33c86.firebaseapp.com",
            projectId: "gram-panchayat-33c86",
            storageBucket: "gram-panchayat-33c86.firebasestorage.app",
            messagingSenderId: "1025176315779",
            appId: "1:1025176315779:web:a24ca10a06c55edcc8f8b6",
            measurementId: "G-TQBSXCWNBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Password Eye Toggle
        document.getElementById("toggle-taluka-pass")?.addEventListener("click", () => {
            const passInput = document.getElementById("login-taluka-password");
            const eyeIcon = document.getElementById("eye-icon");
            if (passInput.type === "password") {
                passInput.type = "text";
                eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                passInput.type = "password";
                eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
            }
        });

        const talukaModal = document.getElementById("taluka-login-modal");
        const talukaDashboard = document.getElementById("taluka-dashboard");
        
        async function checkTalukaAuth() {
            const activeTaluka = sessionStorage.getItem("taluka_logged_name");
            if (activeTaluka) {
                talukaModal.classList.add("hidden");
                talukaDashboard.classList.remove("hidden");
                // હેડરમાં માત્ર તાલુકાનું નામ સેટ કરવું
                document.getElementById("taluka-header-title").textContent = `તાલુકા પંચાયત એડમિન પેનલ - ${activeTaluka}`;
                loadTalukaPanchayats(activeTaluka);
            } else {
                talukaModal.classList.remove("hidden");
                talukaDashboard.classList.add("hidden");
            }
        }

        // Login Form Submit
        document.getElementById("taluka-login-form")?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const talukaName = document.getElementById("login-taluka-name").value.trim();
            const talukaPass = document.getElementById("login-taluka-password").value.trim();

            try {
                const settingsSnap = await getDoc(doc(db, "system_settings", "taluka_credentials"));
                let correctPass = "taluka123";
                let isActive = true;

                if (settingsSnap.exists() && settingsSnap.data()[talukaName]) {
                    const talukaData = settingsSnap.data()[talukaName];
                    correctPass = talukaData.password || "taluka123";
                    isActive = talukaData.isActive !== false;
                }

                if (!isActive) {
                    alert("❌ આ તાલુકાનું એડમિન લોગિન સુપર એડમિન દ્વારા બંધ (Deactive) કરવામાં આવ્યું છે.");
                    return;
                }

                if (talukaPass === correctPass) {
                    sessionStorage.setItem("taluka_logged_name", talukaName);
                    alert("✅ સફળતાપૂર્વક લૉગિન થઈ ગયું!");
                    checkTalukaAuth();
                } else {
                    alert("❌ ખોટો પાસવર્ડ!");
                }
            } catch (err) {
                console.error(err);
                if (talukaPass === "taluka123") {
                    sessionStorage.setItem("taluka_logged_name", talukaName);
                    checkTalukaAuth();
                } else {
                    alert("લૉગિન એરર: " + err.message);
                }
            }
        });

        // Logout with confirmation
        document.getElementById("logout-btn")?.addEventListener("click", () => {
            if (confirm("શું તમે ખરેખર તાલુકા એડમિન પેનલમાંથી લોગઆઉટ કરવા માંગો છો?")) {
                sessionStorage.removeItem("taluka_logged_name");
                checkTalukaAuth();
            }
        });

        // Load Panchayats matching current Taluka
        async function loadTalukaPanchayats(talukaName) {
            const tableBody = document.getElementById("taluka-panchayats-table-body");
            tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">પંચાયતોનો ડેટા લોડ થઈ રહ્યો છે...</td></tr>`;

            try {
                const snapshot = await getDocs(collection(db, "panchayats"));
                tableBody.innerHTML = "";
                let count = 0;

                snapshot.forEach(docSnap => {
                    const data = docSnap.id; // અથવા docSnap.data().taluka સાથે મેચ કરવું
                    const pData = docSnap.data();
                    const pTaluka = pData.taluka || "";
                    const pName = pData.panchayatName || pData.settings?.general?.name || "નામ વગરની પંચાયત";
                    const lgdCode = docSnap.id;

                    // જો તાલુકાનું નામ મેચ થતું હોય (ਕੇ case-insensitive સરખામણી)
                    if (pTaluka.toLowerCase() === talukaName.toLowerCase() || lgdCode.toLowerCase().includes(talukaName.toLowerCase())) {
                        count++;
                        const row = `
                            <tr class="hover:bg-gray-50 border-b">
                                <td class="p-3 font-bold">${count}</td>
                                <td class="p-3 font-mono text-emerald-700 font-bold">${lgdCode}</td>
                                <td class="p-3 font-bold text-gray-900">${pName}</td>
                                <td class="p-3 text-center space-x-1">
                                    <button onclick="showPanchayatData('${lgdCode}', 'about', 'મારૂ ગામ - એક નજરમાં')" class="bg-blue-100 text-blue-800 hover:bg-blue-200 px-2.5 py-1 rounded text-[11px] font-bold">મારૂ ગામ</button>
                                    <button onclick="showPanchayatData('${lgdCode}', 'staff', 'પંચાયત કમિટી અને સ્ટાફ')" class="bg-amber-100 text-amber-800 hover:bg-amber-200 px-2.5 py-1 rounded text-[11px] font-bold">સ્ટાફ</button>
                                    <button onclick="showPanchayatData('${lgdCode}', 'committees', 'કાર્યરત સમિતિઓ')" class="bg-purple-100 text-purple-800 hover:bg-purple-200 px-2.5 py-1 rounded text-[11px] font-bold">સમિતિઓ</button>
                                </td>
                                <td class="p-3 text-center">
                                    <a href="index.html?id=${lgdCode}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-[11px] font-bold shadow inline-flex items-center gap-1">
                                        <i class="fa-solid fa-globe"></i> વેબસાઇટ જુઓ
                                    </a>
                                </td>
                            </tr>
                        `;
                        tableBody.insertAdjacentHTML('beforeend', row);
                    }
                });

                if (count === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-500">આ તાલુકા હેઠળ કોઈ પંચાયત મળી નથી.</td></tr>`;
                }

                document.getElementById("total-panchayats-count").textContent = `કુલ પંચાયતો: ${count}`;
            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">ડેટા લોડ કરવામાં એરર આવી.</td></tr>`;
            }
        }


        

// Global function to fetch and render exact website layout in popup
window.showPanchayatData = async function(lgdCode, dataType, title) {
    const modal = document.getElementById("data-modal");
    const modalTitle = document.getElementById("modal-title");
    const modalContent = document.getElementById("modal-content");

    modalTitle.textContent = `${title} (LGD Code: ${lgdCode})`;
    modalContent.innerHTML = `<div class="text-center py-8 text-gray-500"><i class="fa-solid fa-spinner fa-spin mr-2"></i> માહિતી લોડ થઈ રહી છે...</div>`;
    modal.classList.remove("hidden");

    try {
        let htmlOutput = "";

        // 🌟 ૧. "મારૂ ગામ - એક નજરમાં" (glance.html ના કોડ મુજબ 'village_glance' કલેક્શન)
        if (dataType === 'about') {
            const snap = await getDocs(collection(db, "panchayats", lgdCode, "village_glance"));
            
            if (snap.empty) {
                modalContent.innerHTML = `<div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-lg text-center text-xs">⚠️ આ પંચાયત માટે હજુ સુધી "મારૂ ગામ - એક નજરમાં" ની માહિતી ભરવામાં આવી નથી.</div>`;
                return;
            }

            let sections = {};
            snap.forEach(docSnap => {
                const data = docSnap.data();
                const secName = data.sectionName || "અન્ય માહિતી";
                if (!sections[secName]) sections[secName] = [];
                sections[secName].push(data);
            });

            for (let sectionName in sections) {
                let rowsHtml = sections[sectionName].map(item => `
                    <tr class="border-b hover:bg-gray-50 text-xs">
                        <td class="p-2.5 font-semibold text-gray-800 w-1/3">${item.title || '-'}</td>
                        <td class="p-2.5 text-emerald-700 font-bold w-1/3">${item.value || '-'}</td>
                        <td class="p-2.5 text-gray-600 text-[11px] w-1/3">${item.extraInfo || '-'}</td>
                    </tr>
                `).join("");

                htmlOutput += `
                    <div class="bg-white rounded-xl shadow-md border overflow-hidden mb-4">
                        <div class="bg-emerald-800 text-white px-4 py-2 font-bold text-xs flex items-center gap-2">
                            <i class="fa-solid fa-folder-open text-amber-300"></i> ${sectionName}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-emerald-50 text-emerald-900 text-xs border-b">
                                    <tr>
                                        <th class="p-2.5">વિગત / સુવિધા</th>
                                        <th class="p-2.5">આંકડો / મુખ્ય માહિતી</th>
                                        <th class="p-2.5">વધારાની વિગત</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">${rowsHtml}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        } 
        // 🌟 ૨. "પંચાયત કમિટી અને સ્ટાફ" (panchayat-staff.html ના કોડ મુજબ 'panchayat_committee' અને 'panchayat_staff')
        else if (dataType === 'staff') {
            // મુદત (Meta) મેળવવી
            let termText = "-";
            try {
                const metaDoc = await getDoc(doc(db, "panchayats", lgdCode, "panchayat_meta", "staff_page"));
                if (metaDoc.exists()) termText = metaDoc.data().term || "-";
            } catch (e) {}

            // ચૂંટાયેલ કમિટી
            const commSnap = await getDocs(collection(db, "panchayats", lgdCode, "panchayat_committee"));
            let commRows = "";
            if (!commSnap.empty) {
                let idx = 1;
                commSnap.forEach(d => {
                    const item = d.data();
                    commRows += `
                        <tr class="border-b hover:bg-gray-50 text-xs">
                            <td class="p-2.5 font-bold">${idx++}</td>
                            <td class="p-2.5 font-semibold text-gray-900">${item.name || '-'}</td>
                            <td class="p-2.5"><span class="bg-blue-100 text-blue-900 px-2 py-0.5 rounded font-bold">${item.designation || '-'}</span></td>
                            <td class="p-2.5">${item.ward || '-'}</td>
                            <td class="p-2.5 font-mono">${item.mobile || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                commRows = `<tr><td colspan="5" class="p-3 text-center text-gray-400 text-xs">કોઈ કમિટી સભ્ય ઉપલબ્ધ નથી.</td></tr>`;
            }

            // કર્મચારીઓ
            const staffSnap = await getDocs(collection(db, "panchayats", lgdCode, "panchayat_staff"));
            let staffRows = "";
            if (!staffSnap.empty) {
                let idx = 1;
                staffSnap.forEach(d => {
                    const item = d.data();
                    staffRows += `
                        <tr class="border-b hover:bg-gray-50 text-xs">
                            <td class="p-2.5 font-bold">${idx++}</td>
                            <td class="p-2.5 font-semibold text-gray-900">${item.name || '-'}</td>
                            <td class="p-2.5"><span class="bg-indigo-100 text-indigo-900 px-2 py-0.5 rounded font-bold">${item.designation || '-'}</span></td>
                            <td class="p-2.5 font-mono">${item.mobile || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                staffRows = `<tr><td colspan="4" class="p-3 text-center text-gray-400 text-xs">કોઈ કર્મચારી ઉપલબ્ધ નથી.</td></tr>`;
            }

            htmlOutput = `
                <!-- ભાગ ૧: ચૂંટાયેલ કમિટી -->
                <div class="mb-5 bg-white rounded-xl shadow-md border overflow-hidden">
                    <div class="bg-blue-900 text-white px-4 py-2.5 font-bold text-xs flex justify-between items-center">
                        <span><i class="fa-solid fa-user-tie mr-1.5"></i> ૧. ચૂંટાયેલ પંચાયત કમિટી</span>
                        <span class="bg-amber-400 text-amber-950 px-2 py-0.5 rounded text-[10px]">મુદત: ${termText}</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-blue-50 text-blue-950 text-xs border-b">
                                <tr>
                                    <th class="p-2.5">ક્રમ</th>
                                    <th class="p-2.5">નામ</th>
                                    <th class="p-2.5">હોદ્દો</th>
                                    <th class="p-2.5">વોર્ડ નં.</th>
                                    <th class="p-2.5">મોબાઈલ નંબર</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">${commRows}</tbody>
                        </table>
                    </div>
                </div>

                <!-- ભાગ ૨: કર્મચારીઓ -->
                <div class="bg-white rounded-xl shadow-md border overflow-hidden">
                    <div class="bg-indigo-900 text-white px-4 py-2.5 font-bold text-xs">
                        <i class="fa-solid fa-address-book mr-1.5"></i> ૨. ગ્રામ પંચાયત કર્મચારીઓ
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-indigo-50 text-indigo-950 text-xs border-b">
                                <tr>
                                    <th class="p-2.5">ક્રમ</th>
                                    <th class="p-2.5">કર્મચારીનું નામ</th>
                                    <th class="p-2.5">હોદ્દો</th>
                                    <th class="p-2.5">મોબાઈલ નંબર</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">${staffRows}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }
        // 🌟 ૩. "કાર્યરત સમિતિઓ" (active-committees.html ના કોડ મુજબ 'active_committees' કલેક્શન)
        else if (dataType === 'committees') {
            const snap = await getDocs(collection(db, "panchayats", lgdCode, "active_committees"));

            if (snap.empty) {
                modalContent.innerHTML = `<div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-lg text-center text-xs">⚠️ આ પંચાયત માટે હજુ સુધી "કાર્યરત સમિતિઓ" ની માહિતી ભરવામાં આવી નથી.</div>`;
                return;
            }

            let commHtml = "";
            snap.forEach(d => {
                const item = d.data();
                let membersRows = "";

                if (item.members && item.members.length > 0) {
                    item.members.forEach((m, idx) => {
                        membersRows += `
                            <tr class="hover:bg-gray-50 border-b text-xs">
                                <td class="p-2.5 font-bold">${idx + 1}</td>
                                <td class="p-2.5 font-semibold text-gray-800">${m.name || '-'}</td>
                                <td class="p-2.5">${m.originalDesignation || '-'}</td>
                                <td class="p-2.5"><span class="bg-purple-100 text-purple-900 px-2 py-0.5 rounded font-bold text-[11px]">${m.committeeRole || '-'}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    membersRows = `<tr><td colspan="4" class="p-3 text-center text-gray-400 text-xs">કોઈ સભ્ય ઉમેરેલ નથી.</td></tr>`;
                }

                commHtml += `
                    <div class="bg-white rounded-xl shadow-md border overflow-hidden mb-4">
                        <div class="bg-purple-900 text-white px-4 py-2.5 font-bold text-xs flex items-center gap-2">
                            <i class="fa-solid fa-users text-amber-300"></i> ${item.committeeName || 'સમિતિ'}
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-purple-50 text-purple-950 text-xs border-b">
                                    <tr>
                                        <th class="p-2.5">ક્રમ</th>
                                        <th class="p-2.5">સભ્યનું નામ</th>
                                        <th class="p-2.5">મૂળ હોદ્દો</th>
                                        <th class="p-2.5">સમિતિમાં હોદ્દો</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">${membersRows}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            htmlOutput = commHtml;
        }

        modalContent.innerHTML = htmlOutput || `<div class="text-center text-gray-500 py-6 text-xs">માહિતી ઉપલબ્ધ નથી.</div>`;

    } catch (err) {
        console.error("Error rendering panchayat layout:", err);
        modalContent.innerHTML = `<div class="text-red-600 p-4 text-xs">ડેટા લોડ કરવામાં એરર આવી: ${err.message}</div>`;
    }
};

window.closeDataModal = function() {
    document.getElementById("data-modal").classList.add("hidden");
};

window.copyModalContent = function() {
    const contentEl = document.getElementById("modal-content");
    const textToCopy = contentEl.innerText;
    
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert("📋 માહિતી ટેબલ ફોર્મેટમાં સફળતાપૂર્વક કોપી થઈ ગઈ છે! તમે તેને Excel કે Word માં પેસ્ટ કરી શકો છો.");
    }).catch(err => {
        alert("કોપી કરવામાં નિષ્ફળતા.");
    });
};
        checkTalukaAuth();
    </script>
