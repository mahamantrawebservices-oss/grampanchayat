<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>અધિકારી/કર્મચારી સમય પત્રક</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="bg-gradient-to-r from-amber-700 via-orange-800 to-amber-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-calendar-days"></i> અધિકારી/કર્મચારી ઉપસ્થિતિ સમય પત્રક
            </h1>
            <a href="index.html" class="bg-white text-amber-900 text-xs font-bold px-3 py-1.5 rounded-lg shadow">← મુખ્ય પૃષ્ઠ</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-5xl flex-grow space-y-6">
        <div id="timetable-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-center text-gray-400 col-span-2">સમય પત્રક લોડ થઈ રહ્યું છે...</p>
        </div>
    </main>

    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        async function loadTimetable() {
            const snap = await getDocs(collection(db, "officer_timetable"));
            const container = document.getElementById("timetable-container");
            container.innerHTML = "";

            if (snap.empty) {
                container.innerHTML = `<p class="text-gray-500 text-center col-span-2">કોઈ સમય પત્રક ઉપલબ્ધ નથી.</p>`;
                return;
            }

            snap.forEach(d => {
                const item = d.data();
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-md border border-amber-200 space-y-3">
                        <div class="flex justify-between items-center border-b border-amber-100 pb-2">
                            <div>
                                <h3 class="font-bold text-amber-950 text-base">${item.name}</h3>
                                <p class="text-xs text-amber-700 font-semibold">${item.designation}</p>
                            </div>
                            <span class="text-xs bg-amber-100 text-amber-900 px-2.5 py-1 rounded-full font-bold">📞 ${item.mobile}</span>
                        </div>
                        <div class="text-xs space-y-1.5 text-gray-700">
                            <p><b>પંચાયતે આવવાના દિવસો:</b> <span class="text-emerald-700 font-bold">${item.days}</span></p>
                            <p><b>મુલાકાતનો સમય:</b> ${item.timing}</p>
                            <p><b>ફાળવેલ અન્ય ગામો:</b> ${item.villages || 'ફક્ત આ ગામ'}</p>
                        </div>
                    </div>
                `;
            });
        }
        loadTimetable();
    </script>
</body>
</html>
