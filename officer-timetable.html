<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>અધિકારી/કર્મચારી સમય પત્રક</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <header class="bg-gradient-to-r from-amber-700 via-orange-800 to-amber-700 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-calendar-days"></i> અધિકારી/કર્મચારી ઉપસ્થિતિ સમય પત્રક
            </h1>
            <a href="index.html" class="bg-white text-amber-900 text-xs font-bold px-3 py-1.5 rounded-lg shadow">← મુખ્ય પૃષ્ઠ</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-5xl flex-grow space-y-6">
        <div id="timetable-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="text-center text-gray-400 col-span-2">સમય પત્રક લોડ થઈ રહ્યું છે...</p>
        </div>
    </main>

   <script type="module">
    import { db } from "./js/firebase-config.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    async function loadScheduleCards() {
        const container = document.getElementById("schedule-cards-container"); // તમારું મેઈન Container ID
        if (!container) return;

        try {
            const snap = await getDocs(query(collection(db, "panchayat_schedule"), orderBy("order", "asc")));
            container.innerHTML = "";

            if (snap.empty) {
                container.innerHTML = "<p class='text-center text-gray-500 col-span-2'>કોઈ સમય પત્રક માહિતી ઉપલબ્ધ નથી.</p>";
                return;
            }

            snap.forEach(docSnap => {
                const item = docSnap.data();
                
                // ડેટા મેપિંગ (જૂના અને નવા કી-નેમ માટે)
                const name = item.name || item.officerName || "-";
                const designation = item.designation || item.post || "-";
                const timing = item.timing || item.time || "-";
                const days = item.days || item.workDays || "-";
                const mobile = item.mobile || item.phone || "";
                const note = item.note || item.extraNote || "";

                container.innerHTML += `
                    <div class="bg-amber-50/40 border border-amber-200/60 rounded-xl p-4 shadow-sm relative">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-amber-900 text-base md:text-lg">${name}</h3>
                                <p class="text-xs font-semibold text-amber-800">${designation}</p>
                            </div>
                            ${mobile ? `
                                <a href="tel:${mobile}" class="bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-bold px-2.5 py-1 rounded-full flex items-center gap-1 border border-amber-300">
                                    📞 ${mobile}
                                </a>
                            ` : ''}
                        </div>

                        <div class="mt-3 text-xs space-y-1.5 text-gray-800 border-t border-amber-200/50 pt-2.5">
                            <div><b class="text-amber-950">પંચાયતે આવવાના દિવસો:</b> <span class="text-emerald-700 font-semibold">${days}</span></div>
                            <div><b class="text-amber-950">મુલાકાતનો સમય:</b> ${timing}</div>
                            ${note ? `<div><b class="text-amber-950">ફાળવેલ અન્ય ગામો / નોંધ:</b> ${note}</div>` : ''}
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            console.error("ડેટા લોડ કરવામાં ભૂલ:", err);
        }
    }

    loadScheduleCards();
</script>
</body>
</html>
