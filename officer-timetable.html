<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>અધિકારી / કર્મચારી ઉપસ્થિતિ સમય પત્રક</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans">

    <!-- હેડર -->
    <header class="bg-amber-800 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-calendar-days"></i> અધિકારી/કર્મચારી ઉપસ્થિતિ સમય પત્રક
            </h1>
            <a href="index.html" class="bg-amber-900 hover:bg-amber-950 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow border border-amber-700">← મુખ્ય પૃષ્ઠ</a>
        </div>
    </header>

    <!-- મુખ્ય કન્ટેન્ટ -->
    <main class="container mx-auto px-4 py-8 max-w-5xl flex-grow">
        
        <!-- ડેટા કાર્ડ્સ માટેનું કન્ટેનર -->
        <div id="schedule-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-1 md:col-span-2 text-center py-8 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p class="text-xs">સમય પત્રકની માહિતી લોડ થઈ રહી છે...</p>
            </div>
        </div>

    </main>

    <!-- ફાયરબેઝ ડેટા લોડિંગ સ્ક્રિપ્ટ -->
    <script type="module">
        import { db } from "./js/firebase-config.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        async function loadScheduleCards() {
            const container = document.getElementById("schedule-cards-container");
            if (!container) return;

            try {
                // Firebase માંથી ડેટા લાવવો
                const snap = await getDocs(collection(db, "panchayat_schedule"));
                container.innerHTML = ""; // લોડર કે જૂનો કોડ સાફ કરવો

                if (snap.empty) {
                    container.innerHTML = `
                        <div class="col-span-1 md:col-span-2 text-center py-8 text-gray-500 bg-white rounded-xl border p-4">
                            <p class="text-sm">હાલ કોઈ સમય પત્રક માહિતી ઉપલબ્ધ નથી.</p>
                        </div>`;
                    return;
                }

                snap.forEach(docSnap => {
                    const item = docSnap.data();
                    
                    // જો ડેટાબેઝમાં અલગ નામોથી કી સેવ થઈ હોય તો પણ સાચો ડેટા બતાવે તે માટે:
                    const name = item.name || item.officerName || "-";
                    const designation = item.designation || item.post || item.role || "-";
                    const timing = item.timing || item.time || "-";
                    const days = item.days || item.workDays || "-";
                    const note = item.note || item.extraNote || "";

                    container.innerHTML += `
                        <div class="bg-amber-50/40 border border-amber-200/80 rounded-xl p-4 shadow-sm relative">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-bold text-amber-900 text-base md:text-lg">${name}</h3>
                                    <p class="text-xs font-semibold text-amber-800">${designation}</p>
                                </div>
                            </div>

                            <div class="mt-3 text-xs space-y-1.5 text-gray-800 border-t border-amber-200/60 pt-2.5">
                                <div><b class="text-amber-950">પંચાયતે આવવાના દિવસો:</b> <span class="text-emerald-700 font-semibold">${days}</span></div>
                                <div><b class="text-amber-950">મુલાકાતનો સમય:</b> ${timing}</div>
                                ${note ? `<div class="mt-1"><b class="text-amber-950">ફાળવેલ અન્ય ગામો / નોંધ:</b> ${note}</div>` : ''}
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("ડેટા ફેચ કરવામાં ભૂલ આવી:", err);
                container.innerHTML = `
                    <div class="col-span-1 md:col-span-2 text-center py-4 text-red-500">
                        માહિતી લોડ કરવામાં સમસ્યા આવી છે. કૃપા કરીને પેજ રિફ્રેશ કરો.
                    </div>`;
            }
        }

        // ફંક્શન કોલ કરવું
        loadScheduleCards();
    </script>
</body>
</html>
